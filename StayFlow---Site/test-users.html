<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Teste criação de usuário · StayFlow</title>
</head>
<body>
  <h1>Teste /users (equipe)</h1>

  <p>Clique no botão para criar um usuário de teste.</p>

  <button id="createUserBtn">Criar usuário de teste</button>

  <pre id="result" style="margin-top:16px;white-space:pre-wrap;"></pre>

  <script>
    document.getElementById("createUserBtn").addEventListener("click", async () => {
      const resultEl = document.getElementById("result");
      resultEl.textContent = "Enviando...";

      try {
        const res = await fetch("/users", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({
            name: "Usuário Teste Equipe",
            email: "equipe+teste@hostel.com",
            password: "senhaTeste123",
            role: "staff"
          })
        });

        const data = await res.json();
        resultEl.textContent = JSON.stringify(data, null, 2);
      } catch (err) {
        resultEl.textContent = "Erro na requisição: " + err.message;
      }
    });
  </script>
</body>
</html>

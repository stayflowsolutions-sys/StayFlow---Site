<!DOCTYPE html>
<html lang="pt-BR" translate="no">
<head>
  <meta charset="UTF-8">
  <title>Painel StayFlow · Início</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="google" content="notranslate">
  <link rel="stylesheet" href="static/css/tokens.css">
  <link rel="stylesheet" href="static/css/reset.css">
  <link rel="stylesheet" href="static/css/app.css">
  <style>
    .hub-wrap{max-width:960px;margin:0 auto;padding:60px 24px}
    .hub-header{text-align:center;margin-bottom:36px}
    .hub-header h1{font-size:26px;margin:0 0 8px}
    .hub-header p{color:var(--muted);margin:0;font-size:14px}
    .hub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
    .hub-card{display:block;text-decoration:none;color:inherit;padding:32px 20px;text-align:center;cursor:pointer;transition:transform .15s ease,border-color .15s ease}
    .hub-card:hover{transform:translateY(-2px);border-color:#2f7dff70}
    .hub-card .ico{font-size:36px;margin-bottom:14px}
    .hub-card h2{font-size:17px;margin:0 0 6px}
    .hub-card p{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
    #hubLoading{text-align:center;color:var(--muted);padding:60px}
    @media(max-width:760px){.hub-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="hub-wrap">
    <div class="hub-header">
      <h1>🛠 Painel StayFlow</h1>
      <p>Pra onde você quer ir?</p>
    </div>

    <div id="hubLoading">Carregando...</div>

    <div class="hub-grid" id="hubGrid" style="display:none">
      <a class="card hub-card" href="admin-list.html?kind=agency">
        <div class="ico">✈️</div>
        <h2>Agências</h2>
        <p>Agências de turismo, aluguel de carro/bike/equipamento parceiras.</p>
      </a>
      <a class="card hub-card" href="admin-list.html?kind=lodging">
        <div class="ico">🏨</div>
        <h2>Hospedagens</h2>
        <p>Hostels, hotéis, pousadas e resorts que usam a StayFlow.</p>
      </a>
      <a class="card hub-card" href="admin.html">
        <div class="ico">📊</div>
        <h2>Painel StayFlow</h2>
        <p>Visão financeira consolidada — MRR estimado e comissão real coletada.</p>
      </a>
    </div>
  </div>

  <script>
    (async () => {
      try{
        const res = await fetch("/me", { credentials: "same-origin" });
        if(res.status === 401 || res.status === 403){
          window.location.href = "Login.html";
          return;
        }
        const data = await res.json();
        if(!data.success || !data.is_stayflow_admin){
          window.location.href = "Login.html";
          return;
        }
        document.getElementById("hubLoading").style.display = "none";
        document.getElementById("hubGrid").style.display = "grid";
      }catch(e){
        console.warn("Erro ao carregar hub StayFlow:", e);
        window.location.href = "Login.html";
      }
    })();
  </script>
</body>
</html>
